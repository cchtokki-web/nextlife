name: Retirement Domain Invariants

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: retirement-domain-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retirement-domain-invariants:
    name: retirement-domain-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run retirement engine invariants
        run: npm run test:retirement-domain-invariants
