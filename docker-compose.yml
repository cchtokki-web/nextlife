version: '3.8'

services:
  nextlife:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextlife-app
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Use an external DB or map volume if using sqlite
      - ./dev.db:/app/dev.db
