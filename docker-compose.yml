services:
  nextlife:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: nextlife-dev-app
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data-dev:/app/data
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: development
